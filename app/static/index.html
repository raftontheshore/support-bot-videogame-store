<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Games Support</title>
<style>
  :root {
    --bg: #14111f; --panel: #1e1a2e; --panel2: #2a2540;
    --accent: #ff4d6d; --accent2: #ffd166; --text: #eeeaf7; --muted: #9a94b3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center;
  }
  .app {
    width: 100%; max-width: 640px; height: min(780px, 94vh);
    background: var(--panel); border: 2px solid var(--accent); border-radius: 12px;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 8px 8px 0 #000;
  }
  header {
    padding: 14px 18px; background: #000; color: var(--accent2);
    display: flex; justify-content: space-between; align-items: center;
    font-family: "Courier New", monospace; letter-spacing: 1px;
  }
  header .who { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
  button, select, input { font: inherit; }
  .link { background: none; border: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }
  .hidden { display: none !important; }

  /* login */
  #login { padding: 28px 22px; display: flex; flex-direction: column; gap: 12px; margin: auto; width: 100%; max-width: 360px; }
  #login h2 { margin: 0 0 4px; font-family: "Courier New", monospace; color: var(--accent2); }
  #login p { margin: 0 0 8px; color: var(--muted); font-size: 14px; }
  label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  select, input[type=text], input[type=password] {
    background: var(--panel2); color: var(--text); border: 1px solid #443d63;
    border-radius: 8px; padding: 10px 12px;
  }
  .primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 16px; cursor: pointer; font-weight: 600;
  }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .error { color: #ff8fa3; font-size: 13px; min-height: 18px; }

  /* chat */
  #chat { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; font-size: 14.5px; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .msg.bot { align-self: flex-start; background: var(--panel2); border-bottom-left-radius: 3px; }
  .msg.typing { color: var(--muted); font-style: italic; }
  .msg.system { align-self: center; background: transparent; border: 1px dashed #5a5280; color: var(--muted); font-size: 13px; }
  .pending {
    align-self: flex-start; background: #2d2200; border: 1px solid var(--accent2);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; max-width: 85%;
  }
  .pending .actions { margin-top: 10px; display: flex; gap: 8px; }
  .pending .ok { background: var(--accent2); color: #000; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 700; }
  .pending .no { background: transparent; color: var(--text); border: 1px solid #5a5280; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  #chips { padding: 0 16px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: transparent; color: var(--accent2); border: 1px solid #5a5280;
    border-radius: 999px; padding: 5px 11px; font-size: 12px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent2); }
  #form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #36304f; }
  #input { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span>▶ RETRO GAMES SUPPORT</span>
    <span class="who hidden" id="who">
      <span id="whoName"></span>
      <button class="link" id="logout" type="button">log out</button>
    </span>
  </header>

  <!-- login -->
  <section id="login">
    <h2>Welcome back</h2>
    <p>Demo accounts. Each customer only sees their own orders.</p>
    <label>Customer
      <select id="email">
        <option value="ana@example.com">Ana Pérez (RPG / Adventure fan)</option>
        <option value="bruno@example.com">Bruno Gómez (Racing / Sports fan)</option>
        <option value="carla@example.com">Carla Díaz (Platformer / Puzzle fan)</option>
      </select>
    </label>
    <label>Password (demo)
      <input id="password" type="password" value="test1234" autocomplete="off">
    </label>
    <button class="primary" id="loginBtn" type="button">Sign in</button>
    <div class="error" id="loginError"></div>
  </section>

  <!-- chat -->
  <section id="chat" class="hidden">
    <div id="messages"></div>
    <div id="chips"></div>
    <form id="form">
      <input id="input" type="text" placeholder="Ask about your orders, shipments, returns..." maxlength="500" autocomplete="off">
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
</div>

<script>
const SUGGESTIONS = [
  "Where is my latest shipped order?",
  "Which genres do I buy the most?",
  "Which month did I buy the most games?",
  "How much have I spent this year?",
  "Show me my most purchased games",
  "I want to return my latest delivered order, the disc arrived scratched",
  "Which Racing games do you have for N64?",
];

let token = null;
let history = [];
let busy = false;

const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

// Escape first, then allow only **bold**, bullets and line breaks: model output can never inject HTML.
function format(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^[ \t]*[*-][ \t]+/gm, "• ")
    .replace(/\n/g, "<br>");
}

function addMessage(kind, text) {
  const div = document.createElement("div");
  div.className = "msg " + kind;
  if (kind === "user") div.textContent = text;
  else div.innerHTML = format(text);
  $("messages").appendChild(div);
  $("messages").scrollTop = $("messages").scrollHeight;
  return div;
}

function authHeaders() {
  return { "Content-Type": "application/json", Authorization: "Bearer " + token };
}

function setBusy(value) {
  busy = value;
  $("send").disabled = value;
  $("input").disabled = value;
  if (!value) $("input").focus();
}

function clearPending() {
  const old = $("pending");
  if (old) old.remove();
}

function showPending(p) {
  const card = document.createElement("div");
  card.className = "pending";
  card.id = "pending";
  card.innerHTML =
    "<div><strong>Return request ready</strong><br>Order #" + Number(p.order_id) +
    " — " + escapeHtml(p.reason) + "</div>" +
    '<div class="actions"><button class="ok" type="button">Confirm return</button>' +
    '<button class="no" type="button">Cancel</button></div>';
  card.querySelector(".ok").onclick = confirmReturn;
  card.querySelector(".no").onclick = () => {
    clearPending();
    addMessage("system", "Return request cancelled.");
  };
  $("messages").appendChild(card);
  $("messages").scrollTop = $("messages").scrollHeight;
}

async function confirmReturn() {
  clearPending();
  try {
    const res = await fetch("/ask/confirm", { method: "POST", headers: authHeaders() });
    const data = await res.json();
    if (res.ok) {
      const r = data.return_request;
      addMessage("system", "Return request #" + r.id + " submitted for order #" + r.order_id + " (status: " + r.status + ").");
    } else {
      addMessage("system", data.error || "Could not submit the return.");
    }
  } catch (e) {
    addMessage("system", "Network error. Please try again.");
  }
}

async function send(text) {
  text = text.trim();
  if (busy || !text) return;
  setBusy(true);
  clearPending();
  addMessage("user", text);
  const typing = addMessage("bot typing", "typing…");
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({ message: text, history: history.slice(-20) }),
    });
    const data = await res.json();
    typing.remove();
    if (!res.ok) {
      addMessage("system", data.error || "Something went wrong.");
      if (res.status === 401) logout();
    } else {
      addMessage("bot", data.reply);
      history.push({ role: "user", text }, { role: "model", text: data.reply });
      if (data.pending_action) showPending(data.pending_action);
    }
  } catch (e) {
    typing.remove();
    addMessage("system", "Network error. Please try again.");
  } finally {
    setBusy(false);
  }
}

async function login() {
  $("loginError").textContent = "";
  $("loginBtn").disabled = true;
  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value, password: $("password").value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    token = data.access_token; // kept in memory only: a page refresh logs you out
    history = [];
    $("whoName").textContent = $("email").value;
    $("who").classList.remove("hidden");
    $("login").classList.add("hidden");
    $("chat").classList.remove("hidden");
    $("messages").innerHTML = "";
    addMessage("bot", "Hi! I'm the Retro Games assistant. Ask me about your orders, shipments, returns or purchase history.");
    $("input").focus();
  } catch (e) {
    $("loginError").textContent = e.message;
  } finally {
    $("loginBtn").disabled = false;
  }
}

function logout() {
  token = null;
  history = [];
  $("chat").classList.add("hidden");
  $("who").classList.add("hidden");
  $("login").classList.remove("hidden");
}

SUGGESTIONS.forEach((s) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.textContent = s;
  b.onclick = () => send(s);
  $("chips").appendChild(b);
});

$("loginBtn").onclick = login;
$("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
$("logout").onclick = logout;
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const value = $("input").value;
  $("input").value = "";
  send(value);
});
</script>
</body>
</html>
